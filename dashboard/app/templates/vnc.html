{% extends "base.html" %}
{% block content %}
<h2>Gateway VNC</h2>
<div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
    <span style="color: #888; font-size: 13px;" id="vnc-status">Connecting...</span>
    <div>
        <button class="btn btn-primary" onclick="reconnectVnc()" style="padding: 6px 12px; font-size: 12px;">Reconnect</button>
    </div>
</div>
<div id="vnc-container" style="border: 1px solid #16213e; border-radius: 8px; overflow: hidden; background: #000; width: 100%; height: 70vh;">
</div>
<script type="module">
    import RFB from '/static/novnc/core/rfb.js';

    let rfb;
    const host = '{{ request.headers.get("host", "localhost").split(":")[0] }}';
    const port = {{ novnc_port }};
    const url = 'ws://' + host + ':' + port;
    const statusEl = document.getElementById('vnc-status');

    function connect() {
        if (rfb) {
            rfb.disconnect();
        }
        statusEl.textContent = 'Connecting to ' + url + '...';
        statusEl.style.color = '#fbbf24';

        try {
            rfb = new RFB(
                document.getElementById('vnc-container'),
                url,
                { credentials: { password: '{{ vnc_password }}' } }
            );
            rfb.scaleViewport = true;
            rfb.resizeSession = false;
            rfb.background = '#000000';

            rfb.addEventListener('connect', () => {
                statusEl.textContent = 'Connected';
                statusEl.style.color = '#4ade80';
            });
            rfb.addEventListener('disconnect', (e) => {
                statusEl.textContent = 'Disconnected' + (e.detail.clean ? '' : ' (error)');
                statusEl.style.color = '#ef4444';
                // Auto-reconnect after 3s
                setTimeout(connect, 3000);
            });
            rfb.addEventListener('credentialsrequired', () => {
                rfb.sendCredentials({ password: '{{ vnc_password }}' });
            });
        } catch (e) {
            statusEl.textContent = 'Error: ' + e.message;
            statusEl.style.color = '#ef4444';
            setTimeout(connect, 5000);
        }
    }

    window.reconnectVnc = connect;
    connect();
</script>
{% endblock %}
