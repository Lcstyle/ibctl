{% extends "base.html" %}
{% block content %}
<h2>Controls</h2>
<div class="controls-grid">
    <button class="btn btn-primary"
            hx-post="/api/v1/command"
            hx-vals='{"command": "RESTART"}'
            hx-target="#command-result"
            hx-confirm="Restart the Gateway? This will disconnect all clients.">
        Restart
    </button>
    <button class="btn btn-warning"
            hx-post="/api/v1/command"
            hx-vals='{"command": "RECONNECTDATA"}'
            hx-target="#command-result">
        Reconnect Data
    </button>
    <button class="btn btn-warning"
            hx-post="/api/v1/command"
            hx-vals='{"command": "RECONNECTACCOUNT"}'
            hx-target="#command-result">
        Reconnect Account
    </button>
    <button class="btn btn-primary"
            hx-post="/api/v1/command"
            hx-vals='{"command": "ENABLEAPI"}'
            hx-target="#command-result">
        Enable API
    </button>
    <button class="btn btn-danger"
            hx-post="/api/v1/command"
            hx-vals='{"command": "STOP"}'
            hx-target="#command-result"
            hx-confirm="Stop the Gateway? This will shut down ibctl completely.">
        Stop
    </button>
</div>
<div id="command-result" class="card" style="margin-top: 16px; display: none;"></div>
<script>
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'command-result') {
            evt.detail.target.style.display = 'block';
            try {
                const data = JSON.parse(evt.detail.target.textContent);
                const ok = data.ok;
                evt.detail.target.innerHTML = '<div class="card-label">Command Result</div>' +
                    '<div class="' + (ok ? 'status-connected' : 'status-error') + '">' +
                    (ok ? 'OK: ' + data.command : 'Error: ' + data.error) + '</div>';
            } catch(e) {}
        }
    });
</script>
{% endblock %}
