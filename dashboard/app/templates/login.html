<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ibctl - Login</title>
    <link rel="stylesheet" href="{{ root_path }}/static/style.css?v=25">
    <style>
        .login-container {
            max-width: 380px;
            margin: 80px auto;
            padding: 24px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
        }
        .login-container h2 {
            margin: 0 0 20px 0;
            color: #e4e4e7;
            font-size: 18px;
            text-align: center;
        }
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 4px;
            color: #e4e4e7;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .login-container button:hover {
            background: #2563eb;
        }
        .login-container .github-btn {
            background: #24292e;
            margin-top: 8px;
        }
        .login-container .github-btn:hover {
            background: #1b1f23;
        }
        .login-error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .login-divider {
            text-align: center;
            color: #52525b;
            margin: 16px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>ibctl Dashboard</h2>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ root_path }}/login">
            <input type="hidden" name="next" value="{{ next_path }}">
            <input type="password" name="password" placeholder="Dashboard password" autofocus>
            <button type="submit">Sign in</button>
        </form>

        {% if github_oauth_enabled or oidc_enabled %}
        <div class="login-divider">or</div>
        {% endif %}

        {% if github_oauth_enabled %}
        <a href="{{ root_path }}/auth/github?next={{ next_path }}">
            <button type="button" class="github-btn">Sign in with GitHub</button>
        </a>
        {% endif %}

        {% if oidc_enabled %}
        <a href="{{ root_path }}/auth/oidc?next={{ next_path }}">
            <button type="button" class="github-btn" style="background: #4338ca;">Sign in with SSO</button>
        </a>
        {% endif %}
    </div>
</body>
</html>
