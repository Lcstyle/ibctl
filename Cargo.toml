[workspace]
members = ["ibctl"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
todo = "warn"

[workspace.lints.rust]
# unsafe_code is allowed — all 4 blocks have SAFETY comments and are verified by Miri in CI
unsafe_code = "allow"
