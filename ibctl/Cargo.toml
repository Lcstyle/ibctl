[package]
name = "ibctl"
version = "2.0.0"
edition = "2021"
# MSRV floor: the highest any dependency needs (tokio 1.54 and toml 1.x need
# 1.85), kept low so distro-shipped rustc can still build. CI runs 1.97.
# Re-check after dependency upgrades: `cargo metadata` lists each crate's
# rust_version.
rust-version = "1.85"
license = "MIT"
description = "IBC replacement for automated IB Gateway/TWS login and session management"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
toml = "1"
futures-core = "0.3"
secrecy = "0.10"
jiff = { version = "0.2", features = ["serde"] }
nix = { version = "0.31", features = ["signal", "process"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["full", "test-util"] }
