[package]
name = "ibctl"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "IBC replacement for automated IB Gateway/TWS login and session management"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
toml = "0.8"
futures-core = "0.3"
libc = "0.2"
