# Generated by tools/generate_configs.py — DO NOT EDIT
# ibctl configuration — defaults for Docker deployment
# Override any value via environment variables (see docs/CLIENT_INTEGRATION_GUIDE.md).
# Passwords/secrets are NEVER in this file — use env vars (TWS_PASSWORD, etc.)

[auth]
# set via TWS_USERID env var
tws_userid = ""
# "live", "paper", or "both"
trading_mode = "paper"
# Paper credentials (for TRADING_MODE=both):
# paper.tws_userid = ""    # set via TWS_USERID_PAPER env var

[twofa]
# "oathtool" (shells out) or "builtin" (not yet implemented)
provider = "oathtool"
# name of env var holding TOTP secret
secret_env = "TWOFACTOR_CODE" # pragma: allowlist secret
# "restart" (re-login) or "exit" (shutdown)
timeout_action = "restart"
# max wait for 2FA approval before timeout_action
exit_interval = 120
# 2FA device name for device selection dialog (empty = skip)
device = ""
# force re-login even if timeout_action != restart
relogin_after_timeout = false

[gateway]
tws_path = "/home/ibgateway/Jts"
# empty = use tws_path
tws_settings_path = ""
# auto-detected from TWS_MAJOR_VRSN env var
tws_major_vrsn = ""
java_heap_size = 768
# "gateway" or "tws"
gateway_or_tws = "gateway"
# API and socat port mappings (Gateway listens on api port, socat forwards from socat port)
live_api_port = 4001
paper_api_port = 4002
live_socat_port = 4003
paper_socat_port = 4004

[session]
# "primary", "secondary", or "primaryoverride"
action = "primary"
# "accept", "reject", or "manual"
accept_incoming = "accept"
# "HH:MM" 24h format for Sunday cold restart (empty = disabled)
tws_cold_restart = ""

[command_server]
enabled = false
# live instance command server port
port = 7462
# paper instance command server port
paper_port = 7463
bind_address = "0.0.0.0"
control_from = ["127.0.0.1", "172.0.0.0/8"]

[agent]
socket_path = "/run/ibctl/agent.sock"

[dashboard]
# set IBCTL_DASHBOARD_ENABLED=true to start the web dashboard
enabled = false
port = 8080
# Bearer token for API auth (empty = no auth)
token = ""
# enable debug endpoints
debug_mode = false

# OAuth/SSO (requires dashboard.enabled — secrets are env-only)
# GitHub OAuth: set IBCTL_GITHUB_OAUTH_CLIENT_ID + _CLIENT_SECRET env vars
github_oauth_enabled = false
# OIDC/SSO (Authentik, Keycloak): set IBCTL_OIDC_CLIENT_ID + _CLIENT_SECRET env vars
oidc_enabled = false
# OIDC issuer URL (env: IBCTL_OIDC_ISSUER)
oidc_issuer = ""
# OIDC scopes (env: IBCTL_OIDC_SCOPES)
oidc_scopes = "openid profile email"

# Notifications (ntfy, Slack, Telegram — requires dashboard.enabled)
notifications_enabled = false
# Notification channel: ntfy | slack | telegram (env: IBCTL_NOTIFICATION_CHANNEL)
notification_channel = "ntfy"

# ZMQ PUB socket for external status subscribers (env: IBCTL_ZMQ_ENABLED)
zmq_enabled = true
# ZMQ PUB port (env: IBCTL_ZMQ_PORT)
zmq_port = 5556

[ib_system_status]
enabled = false
# fail-open TTL: if no status push within this period, assume available
ttl_seconds = 600
# Scraper settings (read by dashboard daemon, configurable via env vars too):
# check_interval = 300     # seconds between IB status page scrapes (default 5 min)
# url = "https://www.interactivebrokers.com/en/software/systemStatus.php"
# region = "NA"            # "NA", "EU", or "APAC" — which maintenance windows to monitor
# backend_hosts = "cdc1-hb1.ibllc.com,cdc1-hb2.ibllc.com"  # IB backend servers (checked via TCP probe)
# fallback_host = "interactivebrokers.com"  # CDN fallback for internet ping check

# Alert classification overrides (comma-separated, added to built-in lists):
# extra_exchange_keywords = ""   # e.g., "PAXOS,COINBASE" — alerts mentioning these are non-blocking
# extra_benign_phrases = ""      # e.g., "is resolved" — alerts matching these are non-blocking
# extra_blocking_keywords = ""   # e.g., "emergency" — alerts matching these force CRITICAL severity

[logging]
# "debug", "info", "warn", or "error"
level = "info"
# directory for persistent log files (set via IBCTL_LOG_DIR)
log_dir = ""
# use futures market session dates for log filenames (env: IBCTL_FUTURES_SESSION_LOGGING)
futures_session_logging = false
# hour (0-23 ET) when futures session reopens (env: IBCTL_SESSION_REOPEN_HOUR)
session_reopen_hour = 18

[timing]
# delay between UI actions in config dialog
ui_tick_ms = 100
# Java agent delay after each Swing action
agent_tick_ms = 50
# wait after login button before checking for 2FA
post_login_delay_ms = 1000
# seconds of no popups before considering login complete
popup_quiet_secs = 5
# max seconds to wait for popups
popup_max_wait_secs = 30
# pause after selecting radio buttons on login screen
login_radio_delay_ms = 100
# SIGTERM wait before SIGKILL
jvm_shutdown_timeout_secs = 5
# seconds to wait for login window (0 = wait indefinitely)
login_dialog_timeout_secs = 120
# seconds to wait before restarting JVM after failure
restart_delay_secs = 90
# re-login attempts before cancel + restart JVM (0 = always cancel)
relogin_max_attempts = 1
# action after exhausting re-login attempts: "reauth" or "restart" (env: IBCTL_RELOGIN_FAILURE_ACTION)
relogin_failure_action = "reauth"

[site]
# "primary" or "standby" (env: IBCTL_SITE_ROLE)
role = "primary"
# auto-launch Gateway on startup (env: IBCTL_AUTO_LAUNCH)
auto_launch = true
