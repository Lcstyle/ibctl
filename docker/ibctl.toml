# ibctl configuration — defaults for Docker deployment
# Override any value via environment variables (see docs/CLIENT_INTEGRATION_GUIDE.md).
# Passwords/secrets are NEVER in this file — use env vars (TWS_PASSWORD, etc.)

[auth]
username = ""              # set via TWS_USERID env var
trading_mode = "live"      # "live", "paper", or "both"
# Paper credentials (for TRADING_MODE=both):
# paper.username = ""      # set via TWS_USERID_PAPER env var

[twofa]
provider = "oathtool"      # "oathtool" (shells out) or "builtin" (not yet implemented)
secret_env = "TWOFACTOR_CODE"  # name of env var holding TOTP secret
timeout_action = "restart" # "restart" (re-login) or "exit" (shutdown)
timeout_seconds = 120      # max wait for 2FA approval before timeout_action
device = ""                # 2FA device name for device selection dialog (empty = skip)
relogin_after_timeout = false  # force re-login even if timeout_action != restart

[gateway]
tws_path = "/home/ibgateway/Jts"
settings_path = ""         # empty = use tws_path
version = ""               # auto-detected from TWS_MAJOR_VRSN env var
java_heap_mb = 768
program = "gateway"        # "gateway" or "tws"
# API and socat port mappings (Gateway listens on api port, socat forwards from socat port)
live_api_port = 4001
paper_api_port = 4002
live_socat_port = 4003
paper_socat_port = 4004

[session]
action = "primary"         # "primary", "secondary", or "primaryoverride"
accept_incoming = "accept" # "accept", "reject", or "manual"
cold_restart_time = ""     # "HH:MM" 24h format for Sunday cold restart (empty = disabled)

[command_server]
enabled = true
port = 7462                # live instance command server port
paper_port = 7463          # paper instance command server port
bind_address = "0.0.0.0"
control_from = ["127.0.0.1", "172.0.0.0/8"]

[agent]
socket_path = "/run/ibctl/agent.sock"

[dashboard]
enabled = false             # set IBCTL_DASHBOARD_ENABLED=true to start the web dashboard
port = 8080
token = ""                 # Bearer token for API auth (empty = no auth)
debug_mode = false         # enable debug endpoints

[ib_system_status]
enabled = true
ttl_seconds = 600          # fail-open TTL: if no status push within this period, assume available
# Scraper settings (read by dashboard daemon, configurable via env vars too):
# check_interval = 300     # seconds between IB status page scrapes (default 5 min)
# url = "https://www.interactivebrokers.com/en/software/systemStatus.php"
# region = "NA"            # "NA", "EU", or "APAC" — which maintenance windows to monitor
# backend_hosts = "cdc1-hb1.ibllc.com,cdc1-hb2.ibllc.com"  # IB backend servers (checked via ICMP ping)
# fallback_host = "interactivebrokers.com"  # CDN fallback for internet ping check

[logging]
level = "info"             # "debug", "info", "warn", or "error"

[timing]
ui_tick_ms = 100           # delay between UI actions in config dialog
agent_tick_ms = 50         # Java agent delay after each Swing action
post_login_delay_ms = 1000 # wait after login button before checking for 2FA
popup_quiet_secs = 5       # seconds of no popups before considering login complete
popup_max_wait_secs = 30   # max seconds to wait for popups
login_radio_delay_ms = 100 # pause after selecting radio buttons on login screen
jvm_shutdown_timeout_secs = 5  # SIGTERM wait before SIGKILL
login_dialog_timeout_secs = 120  # seconds to wait for login window (0 = wait indefinitely)
